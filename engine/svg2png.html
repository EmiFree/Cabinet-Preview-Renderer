<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>svg2png</title></head>
<body>
<script>
// Used by the "plan" tool: converts ?src=<project-relative .svg> to PNG and saves it to ?save=<project-relative .png>.
(async () => {
  const Q = new URLSearchParams(location.search);
  const log = (o) => fetch('/api/log', { method: 'POST', body: JSON.stringify(o) });
  try {
    const svg = await (await fetch('/' + Q.get('src'))).text();
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('could not read the SVG')); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });
    const c = document.createElement('canvas');
    const k = Math.min(1, 6000 / Math.max(img.width, img.height));
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise((r) => c.toBlob(r, 'image/png'));
    const res = await fetch('/api/save?path=' + encodeURIComponent(Q.get('save')), { method: 'POST', body: blob });
    if (!res.ok) throw new Error('save failed: ' + res.status);
    await log({ kind: 'done', saved: [(await res.json()).path] });
  } catch (e) { await log({ kind: 'error', error: e.message }); }
})();
</script>
</body>
</html>
